<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Baby Shower - Ana Sofía</title>
  
  <meta property="og:title" content="Baby Shower de Ana Sofía ✨">
  <meta property="og:description" content="Tienes una invitación muy especial. Toca el sobre para abrirla 🎀">
  <meta property="og:image" content="https://invitaciondigita.github.io/invitacion-ana-sofia/portada.jpeg">
  <meta property="og:url" content="https://invitaciondigita.github.io/invitacion-ana-sofia/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #FCF5F7 0%, #F3E2E6 65%, #EAD3D9 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Marco fino decorativo de fondo */
    .marco-fondo {
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(212, 132, 148, 0.45);
      pointer-events: none;
      z-index: 0;
    }

    .marco-fondo::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 0.5px solid rgba(212, 132, 148, 0.25);
    }

    /* Encabezado superior */
    .encabezado {
      text-align: center;
      margin-bottom: 34px;
      z-index: 2;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .encabezado p {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #7D6B69;
      margin-bottom: 6px;
    }

    .encabezado h1 {
      font-family: 'Alex Brush', cursive;
      font-size: 2.6rem;
      font-weight: 400;
      color: #D48494;
      line-height: 1.1;
    }

    /* Escenario 3D del sobre */
    .escenario-sobre {
      position: relative;
      width: 330px;
      height: 220px;
      cursor: pointer;
      perspective: 1200px;
      z-index: 3;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
    }

    .escenario-sobre:hover {
      transform: translateY(-3px);
    }

    /* Cuerpo principal del sobre */
    .sobre-cuerpo {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #F9E8EC 0%, #F1D4DB 100%);
      border-radius: 12px;
      box-shadow:
        0 20px 45px rgba(90, 74, 72, 0.18),
        0 4px 12px rgba(212, 132, 148, 0.2);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.65);
    }

    /* Interior oscuro suave del sobre */
    .sobre-interior {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #DFB3BE 0%, #EBC8D1 100%);
      z-index: 1;
    }

    /* Tarjeta interna elegante que emerge */
    .tarjeta-invitacion {
      position: absolute;
      bottom: 12px;
      left: 16px;
      width: 298px;
      height: 192px;
      background: linear-gradient(180deg, #FFFFFF 0%, #FDF8F9 100%);
      border-radius: 8px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(90, 74, 72, 0.12);
      transition: transform 1s cubic-bezier(0.34, 1.35, 0.64, 1);
      z-index: 2;
    }

    .tarjeta-invitacion::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid #EAB8C2;
      border-radius: 4px;
      pointer-events: none;
    }

    .tarjeta-invitacion .etiqueta {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8C7876;
      margin-bottom: 4px;
    }

    .tarjeta-invitacion .titulo-tarjeta {
      font-family: 'Alex Brush', cursive;
      font-size: 2.3rem;
      color: #D48494;
      font-weight: 400;
      line-height: 1.05;
    }

    .tarjeta-invitacion .linea-dorada {
      width: 55px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4A373, transparent);
      margin: 8px 0;
    }

    .tarjeta-invitacion .sub-tarjeta {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #5A4A48;
    }

    /* Solapas laterales e inferior con sombras realistas */
    .solapas-frontales {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .solapa-izq {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #F8E5E9 0%, #F0D2D9 100%);
      clip-path: polygon(0 0, 52% 52%, 0 100%);
    }

    .solapa-der {
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, #F6E0E5 0%, #ECCBD3 100%);
      clip-path: polygon(100% 0, 48% 52%, 100% 100%);
    }

    .solapa-abajo {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #E8C1CA 0%, #F3D9DF 100%);
      clip-path: polygon(0 100%, 50% 46%, 100% 100%);
      filter: drop-shadow(0 -3px 6px rgba(90, 74, 72, 0.08));
    }

    /* Solapa superior triangular que se abre */
    .solapa-arriba {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 126px;
      background: linear-gradient(180deg, #F5DCE2 0%, #E7BEC7 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.35s;
      z-index: 4;
      filter: drop-shadow(0 6px 10px rgba(90, 74, 72, 0.14));
      border-radius: 12px 12px 0 0;
    }

    /* Sello de lacre artesanal */
    .sello-lacre {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #E9A2B0 0%, #CE7688 55%, #B45B6E 100%);
      box-shadow:
        0 6px 16px rgba(156, 76, 94, 0.45),
        inset 0 2px 4px rgba(255, 255, 255, 0.45),
        inset 0 -3px 6px rgba(120, 48, 64, 0.4);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s ease, opacity 0.4s ease;
      animation: pulsoSello 2.4s infinite ease-in-out;
    }

    .sello-lacre::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 240, 243, 0.55);
      box-shadow: inset 0 1px 3px rgba(120, 48, 64, 0.35);
    }

    .sello-lacre span {
      font-family: 'Alex Brush', cursive;
      font-size: 1.65rem;
      color: #FFF7F8;
      text-shadow: 0 1px 2px rgba(120, 48, 64, 0.5);
      letter-spacing: 1px;
    }

    /* Texto inferior de indicación */
    .pie-indicacion {
      margin-top: 32px;
      text-align: center;
      z-index: 2;
      transition: opacity 0.5s ease;
    }

    .pie-indicacion span {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #8A7270;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(212, 132, 148, 0.3);
    }

    /* Animaciones al abrir el sobre */
    .escenario-sobre.abierto .solapa-arriba {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .escenario-sobre.abierto .sello-lacre {
      animation: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.65);
    }

    .escenario-sobre.abierto .tarjeta-invitacion {
      transform: translateY(-92px);
    }

    body.saliendo .encabezado,
    body.saliendo .pie-indicacion {
      opacity: 0;
      transform: translateY(-10px);
    }

    body.saliendo .escenario-sobre {
      transform: scale(1.08) translateY(-15px);
      opacity: 0;
    }

    @keyframes pulsoSello {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 6px 16px rgba(156, 76, 94, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.45);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.06);
        box-shadow: 0 10px 24px rgba(212, 132, 148, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.55);
      }
    }
  </style>
</head>
<body>

  <div class="marco-fondo"></div>

  <header class="encabezado">
    <p>Tienes una invitación especial</p>
    <h1>Baby Shower</h1>
  </header>

  <main class="escenario-sobre" id="sobre" onclick="abrirInvitacion()">
    <div class="sobre-cuerpo">
      <div class="sobre-interior"></div>

      <div class="tarjeta-invitacion">
        <span class="etiqueta">Con mucho amor</span>
        <h2 class="titulo-tarjeta">Ana Sofía</h2>
        <div class="linea-dorada"></div>
        <p class="sub-tarjeta">Abriendo tu invitación...</p>
      </div>

      <div class="solapas-frontales">
        <div class="solapa-izq"></div>
        <div class="solapa-der"></div>
        <div class="solapa-abajo"></div>
      </div>
    </div>

    <div class="solapa-arriba"></div>

    <div class="sello-lacre">
      <span>AS</span>
    </div>
  </main>

  <footer class="pie-indicacion">
    <span>Toca el sello para abrir</span>
  </footer>

  <script>
    const URL_DESTINO = "https://babyshowerab.my.canva.site/invitaci-nanasof-a";
    let yaAbierto = false;

    function abrirInvitacion() {
      if (yaAbierto) return;
      yaAbierto = true;

      const sobre = document.getElementById("sobre");
      sobre.classList.add("abierto");

      setTimeout(function() {
        document.body.classList.add("saliendo");
      }, 950);

      setTimeout(function() {
        window.location.href = URL_DESTINO;
      }, 1550);
    }
  </script>
</body>
</html>
